<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrador - Streaming EC</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0b;
    color: #fff;
}

header {
    background: #111;
    border-bottom: 1px solid #292929;
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #e50914;
}

.admin {
    font-size: 16px;
}

.contenedor {
    max-width: 1150px;
    margin: auto;
    padding: 40px 20px;
}

.encabezado {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

h1 {
    margin: 0 0 8px;
    font-size: 34px;
}

.subtitulo {
    color: #aaa;
    margin: 0;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
    border-radius: 9px;
    padding: 13px 20px;
    font-size: 15px;
}

.btn-agregar {
    background: #222;
    color: white;
}

.btn-agregar:hover {
    background: #333;
}

.btn-guardar {
    background: #e50914;
    color: white;
    font-size: 17px;
    padding: 15px 25px;
}

.btn-guardar:hover {
    background: #b20710;
}

.estado {
    display: none;
    padding: 15px;
    margin-bottom: 25px;
    border-radius: 9px;
    background: #172b1b;
    color: #4ade80;
}

.estado.error {
    background: #351414;
    color: #ff6b6b;
}

.productos {
    display: grid;
    gap: 25px;
}

.producto {
    background: #151515;
    border: 1px solid #2b2b2b;
    border-radius: 15px;
    padding: 25px;
}

.producto-cabecera {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.producto-numero {
    color: #888;
    font-size: 14px;
}

.producto h2 {
    margin: 4px 0 0;
    font-size: 23px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.campo {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.campo.ancho {
    grid-column: 1 / -1;
}

label {
    color: #bbb;
    font-size: 14px;
    font-weight: bold;
}

input,
textarea,
select {
    width: 100%;
    background: #0d0d0d;
    color: white;
    border: 1px solid #363636;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-family: Arial, sans-serif;
    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #e50914;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.descripcion {
    min-height: 90px;
}

.detalles {
    min-height: 130px;
}

.solicitud {
    min-height: 130px;
}

.imagen-preview {
    margin-top: 10px;
    max-width: 180px;
    max-height: 120px;
    border-radius: 8px;
    object-fit: cover;
    display: none;
    border: 1px solid #333;
}

.activo-contenedor {
    margin-top: 20px;
    padding: 15px;
    background: #101010;
    border-radius: 9px;
    border: 1px solid #292929;
    display: flex;
    align-items: center;
    gap: 10px;
}

.activo-contenedor input {
    width: 18px;
    height: 18px;
}

.activo-contenedor label {
    cursor: pointer;
}

.btn-eliminar {
    background: #2a1111;
    color: #f87171;
    border: 1px solid #542020;
}

.btn-eliminar:hover {
    background: #451a1a;
}

.sin-productos {
    padding: 50px 20px;
    text-align: center;
    background: #151515;
    border: 1px dashed #333;
    border-radius: 15px;
    color: #aaa;
}

.acciones-finales {
    margin-top: 30px;
    display: flex;
    justify-content: flex-start;
}

@media (max-width: 700px) {

    header {
        padding: 18px;
    }

    .contenedor {
        padding: 25px 15px;
    }

    .encabezado {
        flex-direction: column;
        align-items: stretch;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .campo.ancho {
        grid-column: auto;
    }

    .producto-cabecera {
        gap: 15px;
        align-items: flex-start;
    }

    .btn-agregar {
        width: 100%;
    }

}
</style>
</head>

<body>

<header>

    <div class="logo">
        Streaming <span>EC</span>
    </div>

    <div class="admin">
        ⚙️ Administrador
    </div>

</header>

<main class="contenedor">

    <div class="encabezado">

        <div>
            <h1>Productos</h1>

            <p class="subtitulo">
                Administra los productos y servicios de tu tienda.
            </p>
        </div>

        <button
            class="btn-agregar"
            onclick="agregarProducto()"
        >
            ➕ Agregar producto
        </button>

    </div>


    <div
        id="estado"
        class="estado"
    ></div>


    <div
        id="productos"
        class="productos"
    >

        <div class="sin-productos">
            Cargando productos...
        </div>

    </div>


    <div class="acciones-finales">

        <button
            class="btn-guardar"
            onclick="guardarCambios()"
        >
            💾 Guardar cambios
        </button>

    </div>

</main>


<script>

let productos = [];


// ==================================================
// CARGAR PRODUCTOS
// ==================================================

async function cargarProductos() {

    const contenedor =
        document.getElementById("productos");

    try {

        const respuesta =
            await fetch("/api/productos");

        if (!respuesta.ok) {

            throw new Error(
                "La API no respondió correctamente."
            );

        }

        productos =
            await respuesta.json();

        if (!Array.isArray(productos)) {

            throw new Error(
                "La API devolvió un formato incorrecto."
            );

        }

        mostrarProductos();

    } catch (error) {

        contenedor.innerHTML = `
            <div class="sin-productos">
                ❌ No se pudieron cargar los productos.
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

    }

}


// ==================================================
// MOSTRAR PRODUCTOS
// ==================================================

function mostrarProductos() {

    const contenedor =
        document.getElementById("productos");

    contenedor.innerHTML = "";


    if (productos.length === 0) {

        contenedor.innerHTML = `
            <div class="sin-productos">

                <div style="font-size:40px;">
                    📦
                </div>

                <h3>
                    No hay productos todavía
                </h3>

                <p>
                    Pulsa "Agregar producto" para crear
                    tu primer producto.
                </p>

            </div>
        `;

        return;

    }


    productos.forEach(
        (producto, indice) => {

            const tarjeta =
                document.createElement("div");

            tarjeta.className =
                "producto";


            tarjeta.innerHTML = `

                <div class="producto-cabecera">

                    <div>

                        <div class="producto-numero">
                            PRODUCTO ${indice + 1}
                        </div>

                        <h2>
                            ${escapeHtml(
                                producto.nombre ||
                                "Nuevo producto"
                            )}
                        </h2>

                    </div>

                    <button
                        class="btn-eliminar"
                        onclick="eliminarProducto(${indice})"
                    >
                        🗑️ Eliminar
                    </button>

                </div>


                <div class="grid">


                    <!-- NOMBRE -->

                    <div class="campo">

                        <label>
                            Nombre del producto *
                        </label>

                        <input
                            type="text"
                            value="${escapeAttr(
                                producto.nombre || ""
                            )}"
                            placeholder="Ej: Netflix Premium"
                            oninput="
                                actualizar(
                                    ${indice},
                                    'nombre',
                                    this.value
                                )
                            "
                        >

                    </div>


                    <!-- PRECIO -->

                    <div class="campo">

                        <label>
                            Precio *
                        </label>

                        <input
                            type="number"
                            min="0"
                            step="0.01"
                            value="${producto.precio ?? 0}"
                            placeholder="0.00"
                            oninput="
                                actualizar(
                                    ${indice},
                                    'precio',
                                    Number(this.value)
                                )
                            "
                        >

                    </div>


                    <!-- CATEGORIA -->

                    <div class="campo">

                        <label>
                            Categoría
                        </label>

                        <select
                            onchange="
                                actualizar(
                                    ${indice},
                                    'categoria',
                                    this.value
                                )
                            "
                        >

                            <option
                                value=""
                                ${!producto.categoria
                                    ? "selected"
                                    : ""}
                            >
                                Seleccionar categoría
                            </option>

                            <option
                                value="Streaming"
                                ${producto.categoria === "Streaming"
                                    ? "selected"
                                    : ""}
                            >
                                Streaming
                            </option>

                            <option
                                value="Cursos"
                                ${producto.categoria === "Cursos"
                                    ? "selected"
                                    : ""}
                            >
                                Cursos
                            </option>

                            <option
                                value="Software"
                                ${producto.categoria === "Software"
                                    ? "selected"
                                    : ""}
                            >
                                Software
                            </option>

                            <option
                                value="IA"
                                ${producto.categoria === "IA"
                                    ? "selected"
                                    : ""}
                            >
                                Inteligencia Artificial
                            </option>

                            <option
                                value="Licencias"
                                ${producto.categoria === "Licencias"
                                    ? "selected"
                                    : ""}
                            >
                                Licencias
                            </option>

                            <option
                                value="Otros"
                                ${producto.categoria === "Otros"
                                    ? "selected"
                                    : ""}
                            >
                                Otros
                            </option>

                        </select>

                    </div>


                    <!-- IMAGEN -->

                    <div class="campo">

                        <label>
                            URL de imagen
                        </label>

                        <input
                            type="url"
                            value="${escapeAttr(
                                producto.imagen || ""
                            )}"
                            placeholder="https://..."
                            oninput="
                                actualizar(
                                    ${indice},
                                    'imagen',
                                    this.value
                                );
                                actualizarPreview(
                                    ${indice},
                                    this.value
                                )
                            "
                        >

                        <img
                            id="preview-${indice}"
                            class="imagen-preview"
                            src="${escapeAttr(
                                producto.imagen || ""
                            )}"
                            style="
                                display:${
                                    producto.imagen
                                    ? "block"
                                    : "none"
                                };
                            "
                            onerror="
                                this.style.display='none'
                            "
                        >

                    </div>


                    <!-- DESCRIPCION -->

                    <div class="campo ancho">

                        <label>
                            Descripción
                        </label>

                        <textarea
                            class="descripcion"
                            placeholder="
                                Ej: Disfruta del servicio
                                durante 3 meses.
                            "
                            oninput="
                                actualizar(
                                    ${indice},
                                    'descripcion',
                                    this.value
                                )
                            "
                        >${escapeHtml(
                            producto.descripcion || ""
                        )}</textarea>

                    </div>


                    <!-- DETALLES -->

                    <div class="campo ancho">

                        <label>
                            Detalles del producto
                        </label>

                        <textarea
                            class="detalles"
                            placeholder="
                                Ej:
                                • Duración: 3 meses
                                • Activación inmediata
                                • Soporte incluido
                                • Compatible con TV y móvil
                            "
                            oninput="
                                actualizar(
                                    ${indice},
                                    'detalles',
                                    this.value
                                )
                            "
                        >${escapeHtml(
                            producto.detalles || ""
                        )}</textarea>

                    </div>


                    <!-- DETALLES DE SOLICITUD -->

                    <div class="campo ancho">

                        <label>
                            Detalles de solicitud
                        </label>

                        <textarea
                            class="solicitud"
                            placeholder="
                                Indica qué debe enviar
                                el cliente para realizar
                                la solicitud.
                            "
                            oninput="
                                actualizar(
                                    ${indice},
                                    'detalles_solicitud',
                                    this.value
                                )
                            "
                        >${escapeHtml(
                            producto.detalles_solicitud || ""
                        )}</textarea>

                    </div>

                </div>


                <!-- ACTIVO -->

                <div class="activo-contenedor">

                    <input
                        id="activo-${indice}"
                        type="checkbox"
                        ${
                            producto.activo
                            ? "checked"
                            : ""
                        }
                        onchange="
                            actualizar(
                                ${indice},
                                'activo',
                                this.checked
                            )
                        "
                    >

                    <label for="activo-${indice}">
                        Producto activo
                    </label>

                </div>

            `;


            contenedor.appendChild(tarjeta);

        }
    );

}


// ==================================================
// ACTUALIZAR PRODUCTO
// ==================================================

function actualizar(
    indice,
    campo,
    valor
) {

    productos[indice][campo] = valor;

}


// ==================================================
// PREVISUALIZAR IMAGEN
// ==================================================

function actualizarPreview(
    indice,
    url
) {

    const imagen =
        document.getElementById(
            `preview-${indice}`
        );

    if (!imagen) return;

    if (!url) {

        imagen.style.display = "none";

        return;

    }

    imagen.src = url;

    imagen.style.display = "block";

}


// ==================================================
// AGREGAR PRODUCTO
// ==================================================

function agregarProducto() {

    const nuevoId =
        "producto-" + Date.now();


    productos.push({

        id: nuevoId,

        nombre: "",

        precio: 0,

        descripcion: "",

        detalles: "",

        detalles_solicitud: "",

        categoria: "",

        imagen: "",

        activo: true

    });


    mostrarProductos();


    mostrarEstado(
        "➕ Producto nuevo agregado. Completa sus datos y pulsa Guardar cambios.",
        false
    );


    window.scrollTo({

        top: document.body.scrollHeight,

        behavior: "smooth"

    });

}


// ==================================================
// ELIMINAR PRODUCTO
// ==================================================

function eliminarProducto(indice) {

    const producto =
        productos[indice];


    const nombre =
        producto.nombre ||
        "este producto";


    if (
        !confirm(
            `¿Seguro que quieres eliminar "${nombre}"?`
        )
    ) {

        return;

    }


    productos.splice(
        indice,
        1
    );


    mostrarProductos();

}


// ==================================================
// GUARDAR CAMBIOS
// ==================================================

async function guardarCambios() {

    mostrarEstado(
        "💾 Guardando cambios...",
        false
    );


    try {

        const respuesta =
            await fetch(
                "/api/productos",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            productos
                        )

                }
            );


        const resultado =
            await respuesta.json();


        if (!respuesta.ok) {

            throw new Error(
                resultado.error ||
                "No se pudieron guardar los cambios."
            );

        }


        mostrarEstado(
            "✅ Productos guardados correctamente.",
            false
        );


        mostrarProductos();


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });


    } catch (error) {

        mostrarEstado(
            "❌ " + error.message,
            true
        );

    }

}


// ==================================================
// MENSAJES
// ==================================================

function mostrarEstado(
    mensaje,
    esError
) {

    const estado =
        document.getElementById(
            "estado"
        );


    estado.style.display =
        "block";


    estado.className =
        esError
        ? "estado error"
        : "estado";


    estado.textContent =
        mensaje;

}


// ==================================================
// SEGURIDAD
// ==================================================

function escapeHtml(texto) {

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttr(texto) {

    return escapeHtml(texto);

}


// ==================================================
// INICIAR
// ==================================================

cargarProductos();

</script>

</body>
</html>
