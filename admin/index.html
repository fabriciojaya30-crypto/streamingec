<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrador - Streaming EC</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0b;
    color: #fff;
}

header {
    background: #111;
    border-bottom: 1px solid #292929;
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

header span {
    color: #e50914;
}

.contenedor {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 20px;
}

.encabezado-productos {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

h2 {
    font-size: 32px;
    margin: 0 0 8px 0;
}

.subtitulo {
    color: #aaa;
    margin: 0;
}

.estado {
    display: none;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    background: #172b1b;
    color: #4ade80;
}

.estado.error {
    background: #2a1111;
    color: #f87171;
}

.productos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
}

.producto {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 22px;
    position: relative;
}

.producto h3 {
    margin-top: 0;
    font-size: 22px;
}

.campo {
    margin-top: 16px;
}

.campo label {
    display: block;
    color: #aaa;
    font-size: 14px;
    margin-bottom: 6px;
}

.campo input {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #0d0d0d;
    color: white;
    font-size: 16px;
}

.activo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    color: #ccc;
}

.activo input {
    width: 18px;
    height: 18px;
}

.badge {
    display: inline-block;
    margin-top: 10px;
    padding: 5px 10px;
    border-radius: 20px;
    background: #14532d;
    color: #4ade80;
    font-size: 12px;
}

.badge.inactivo {
    background: #451a1a;
    color: #f87171;
}

.botones {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.boton {
    padding: 14px 22px;
    border: 0;
    border-radius: 9px;
    background: #e50914;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.boton:hover {
    background: #b20710;
}

.boton-secundario {
    background: #222;
}

.boton-secundario:hover {
    background: #333;
}

.boton-eliminar {
    width: 100%;
    margin-top: 15px;
    padding: 10px;
    border: 1px solid #5c2020;
    border-radius: 8px;
    background: #2a1111;
    color: #f87171;
    cursor: pointer;
}

.boton-eliminar:hover {
    background: #451a1a;
}

.cargando {
    color: #aaa;
    padding: 30px 0;
}

.error {
    color: #f87171;
    background: #2a1111;
    padding: 15px;
    border-radius: 8px;
}

@media (max-width: 650px) {

    .encabezado-productos {
        flex-direction: column;
        align-items: stretch;
    }

    .encabezado-productos .boton {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>Streaming <span>EC</span></h1>
    <div>⚙️ Administrador</div>
</header>

<main class="contenedor">

    <div class="encabezado-productos">

        <div>
            <h2>Productos</h2>

            <p class="subtitulo">
                Administra los productos y servicios de tu tienda.
            </p>
        </div>

        <button class="boton boton-secundario" onclick="agregarProducto()">
            ➕ Agregar producto
        </button>

    </div>

    <div id="estado" class="estado"></div>

    <div id="productos" class="productos">

        <div class="cargando">
            Cargando productos...
        </div>

    </div>

    <div class="botones">

        <button class="boton" onclick="guardarCambios()">
            💾 Guardar cambios
        </button>

    </div>

</main>

<script>

let productos = [];


// ==========================================
// CARGAR PRODUCTOS
// ==========================================

async function cargarProductos() {

    const contenedor = document.getElementById("productos");

    try {

        const respuesta = await fetch("/admin/api/productos.js");

        if (!respuesta.ok) {
            throw new Error("No se pudo acceder a la API.");
        }

        productos = await respuesta.json();

        mostrarProductos();

    } catch (error) {

        contenedor.innerHTML = `
            <div class="error">
                ❌ Error al cargar los productos.<br><br>
                ${error.message}
            </div>
        `;

    }
}


// ==========================================
// MOSTRAR PRODUCTOS
// ==========================================

function mostrarProductos() {

    const contenedor = document.getElementById("productos");

    contenedor.innerHTML = "";

    productos.forEach((producto, indice) => {

        const tarjeta = document.createElement("div");

        tarjeta.className = "producto";

        tarjeta.innerHTML = `

            <h3>${escapeHtml(producto.nombre)}</h3>

            <div class="badge ${producto.activo ? "" : "inactivo"}">
                ${producto.activo ? "Activo" : "Inactivo"}
            </div>

            <div class="campo">

                <label>Nombre</label>

                <input
                    type="text"
                    value="${escapeHtml(producto.nombre)}"
                    oninput="actualizarNombre(${indice}, this.value)"
                >

            </div>

            <div class="campo">

                <label>Precio</label>

                <input
                    type="number"
                    min="0"
                    step="0.01"
                    value="${producto.precio}"
                    oninput="actualizarPrecio(${indice}, this.value)"
                >

            </div>

            <label class="activo">

                <input
                    type="checkbox"
                    ${producto.activo ? "checked" : ""}
                    onchange="actualizarActivo(${indice}, this.checked)"
                >

                Producto activo

            </label>

            <button
                class="boton-eliminar"
                onclick="eliminarProducto(${indice})"
            >
                🗑️ Eliminar producto
            </button>

        `;

        contenedor.appendChild(tarjeta);

    });
}


// ==========================================
// ACTUALIZAR DATOS
// ==========================================

function actualizarNombre(indice, valor) {

    productos[indice].nombre = valor;

}

function actualizarPrecio(indice, valor) {

    productos[indice].precio = Number(valor);

}

function actualizarActivo(indice, valor) {

    productos[indice].activo = valor;

    mostrarProductos();

}


// ==========================================
// AGREGAR PRODUCTO
// ==========================================

function agregarProducto() {

    const nuevoProducto = {

        id: "producto-" + Date.now(),

        nombre: "Nuevo producto",

        precio: 0,

        activo: true

    };

    productos.push(nuevoProducto);

    mostrarProductos();

    const estado = document.getElementById("estado");

    estado.className = "estado";

    estado.style.display = "block";

    estado.textContent =
        "➕ Producto agregado. Escribe su nombre y precio y luego pulsa Guardar cambios.";

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

}


// ==========================================
// ELIMINAR PRODUCTO
// ==========================================

function eliminarProducto(indice) {

    const producto = productos[indice];

    const confirmar = confirm(
        `¿Seguro que quieres eliminar "${producto.nombre}"?`
    );

    if (!confirmar) {
        return;
    }

    productos.splice(indice, 1);

    mostrarProductos();

}


// ==========================================
// GUARDAR CAMBIOS
// ==========================================

async function guardarCambios() {

    const estado = document.getElementById("estado");

    estado.className = "estado";

    estado.style.display = "block";

    estado.textContent = "💾 Guardando cambios...";

    try {

        const respuesta = await fetch("/admin/api/productos.js", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(productos)

        });

        const resultado = await respuesta.json();

        if (!respuesta.ok) {

            throw new Error(
                resultado.error || "No se pudieron guardar los cambios."
            );

        }

        estado.textContent =
            "✅ Productos guardados correctamente.";

        mostrarProductos();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } catch (error) {

        estado.className = "estado error";

        estado.textContent =
            "❌ " + error.message;

    }

}


// ==========================================
// SEGURIDAD HTML
// ==========================================

function escapeHtml(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


// ==========================================
// INICIAR
// ==========================================

cargarProductos();

</script>

</body>
</html>
