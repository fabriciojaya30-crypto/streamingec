<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Streaming EC</title><link rel="stylesheet" href="style.css"></head><body><header><div class="c nav"><a class="brand" href="index.html"><img src="logo.jpg"><span>Streaming EC</span></a><nav class="links"><a href="#catalogo">Catálogo</a><a href="cursos.html">Cursos</a><a class="btn wa" href="https://wa.me/qr/2D6ZXQWJBBC7C1">WhatsApp</a></nav></div></header><main><section class="hero"><div class="c"><span class="badge">TIENDA DIGITAL</span><h1>Todo lo digital,<br><span class="red">bien organizado.</span></h1><p class="muted">Streaming, inteligencia artificial, diseño, cursos y licencias. Entra a cada producto para ver sus planes, detalles y condiciones antes de comprar.</p><a class="btn primary" href="#catalogo">Ver catálogo →</a></div></section><section class="section" id="catalogo"><div class="c"><h2>Productos destacados</h2><input id="q" class="search" placeholder="Buscar Netflix, Gemini, cursos, Office..."><div class="chips"><button class="chip active" data-cat="Todos">Todos</button><button class="chip" data-cat="Streaming">Streaming</button><button class="chip" data-cat="Inteligencia Artificial">IA</button><button class="chip" data-cat="Música">Música</button><button class="chip" data-cat="Diseño">Diseño</button><button class="chip" data-cat="Cursos">Cursos</button><button class="chip" data-cat="Software y licencias">Software</button></div><div class="grid" id="grid"></div></div></section></main><footer><div class="c">© 2026 Streaming EC</div></footer><script>const P={"netflix": ["Netflix", "Streaming", ["Netflix 4K — 1 mes", "Netflix 4K — 3 meses"]], "chatgpt": ["ChatGPT", "Inteligencia Artificial", ["Plan 1 — 1 mes", "Plan 2 — 3 meses", "Plan 3 — 6 meses"]], "gemini": ["Gemini PRO + Google One", "Inteligencia Artificial", ["Gemini PRO — 1 mes", "Gemini PRO — 3 meses", "Gemini PRO — 12 meses"]], "spotify": ["Spotify Premium", "Música", ["Premium — 1 mes", "Premium — 3 meses"]], "youtube": ["YouTube Premium", "Streaming", ["Premium — 1 mes", "Premium — 3 meses"]], "canva": ["Canva Premium PRO", "Diseño", ["Canva PRO — 1 mes", "Canva PRO — 12 meses"]], "cursos": ["Cursos", "Cursos", ["Curso de ejemplo — Acceso digital", "Curso premium — Acceso digital"]], "microsoft-office": ["Microsoft Office 365", "Software y licencias", ["Office 365 — 1 año", "Office 365 — Personalizado"]]};let cat='Todos';const g=document.querySelector('#grid'),q=document.querySelector('#q');function render(){let s=q.value.toLowerCase();g.innerHTML=Object.entries(P).filter(([k,p])=>(cat==='Todos'||p[1]===cat)&&p[0].toLowerCase().includes(s)).map(([k,p])=>'<article class="card"><div class="icon">'+p[0].slice(0,2).toUpperCase()+'</div><span class="badge">'+p[1]+'</span><h3>'+p[0]+'</h3><p>Ver planes, descripción, requisitos, garantía y preguntas frecuentes.</p><a class="btn primary" href="'+k+'.html">Ver planes →</a></article>').join('')}q.oninput=render;document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{document.querySelectorAll('.chip').forEach(y=>y.classList.remove('active'));x.classList.add('active');cat=x.dataset.cat;render()});render()</script></body></html>
