<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administración - Streaming EC</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #090909;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: min(1200px, 94%);
            margin: 40px auto;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #999;
            margin-bottom: 30px;
        }

        .barra {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        input,
        select,
        textarea {
            width: 100%;
            background: #111;
            color: #fff;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .buscador {
            flex: 1;
            min-width: 250px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 13px 18px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .btn-nuevo {
            background: #e50914;
        }

        .btn-guardar {
            background: #16803c;
        }

        .btn-editar {
            background: #333;
        }

        .btn-eliminar {
            background: #7f1d1d;
        }

        .btn-subir {
            background: #444;
        }

        .estado {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .estado.ok {
            display: block;
            background: #123d22;
            color: #63e58c;
        }

        .estado.error {
            display: block;
            background: #451515;
            color: #ff7777;
        }

        .producto {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .producto-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .producto-id {
            color: #888;
            font-size: 13px;
        }

        .producto-header h2 {
            margin: 5px 0;
            font-size: 23px;
        }

        .acciones {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .campo label {
            font-weight: bold;
            color: #ccc;
        }

        .campo-completo {
            grid-column: 1 / -1;
        }

        .imagen-box {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .preview {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            object-fit: cover;
            background: #222;
            border: 1px solid #333;
        }

        .upload-info {
            flex: 1;
            min-width: 220px;
        }

        .activo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .activo input {
            width: auto;
        }

        .sin-resultados {
            text-align: center;
            color: #888;
            padding: 50px;
        }

        .contador {
            color: #888;
            margin-bottom: 15px;
        }

        @media (max-width: 700px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .campo-completo {
                grid-column: auto;
            }

            .container {
                width: 94%;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <h1>⚙️ Panel de Administración</h1>

    <div class="subtitulo">
        Administra categorías y productos de Streaming EC.
    </div>


    <div id="estado" class="estado"></div>


    <div class="barra">

        <input
            id="buscar"
            class="buscador"
            type="search"
            placeholder="🔎 Buscar producto..."
        >

        <button
            class="btn-nuevo"
            onclick="nuevoProducto()"
        >
            ➕ Agregar producto
        </button>

    </div>


    <div id="contador" class="contador">
        Cargando productos...
    </div>


    <div id="productos"></div>

</div>


<script>

let productos = [];


// ==========================================
// MOSTRAR MENSAJE
// ==========================================

function mensaje(texto, tipo = "ok") {

    const estado = document.getElementById("estado");

    estado.textContent = texto;

    estado.className = "estado " + tipo;

    setTimeout(() => {
        estado.className = "estado";
    }, 4000);
}


// ==========================================
// CARGAR PRODUCTOS
// ==========================================

async function cargarProductos() {

    try {

        const respuesta = await fetch("/api/productos");

        if (!respuesta.ok) {
            throw new Error("No se pudieron cargar los productos");
        }

        productos = await respuesta.json();

        renderProductos();

    } catch (error) {

        console.error(error);

        document.getElementById("contador").textContent =
            "Error al cargar productos";

        mensaje(
            "No se pudieron cargar los productos",
            "error"
        );
    }
}


// ==========================================
// MOSTRAR PRODUCTOS
// ==========================================

function renderProductos() {

    const contenedor =
        document.getElementById("productos");

    const busqueda =
        document
            .getElementById("buscar")
            .value
            .toLowerCase()
            .trim();


    const filtrados = productos.filter(producto => {

        return (
            String(producto.nombre || "")
                .toLowerCase()
                .includes(busqueda)
            ||
            String(producto.categoria || "")
                .toLowerCase()
                .includes(busqueda)
        );

    });


    document.getElementById("contador").textContent =
        `${filtrados.length} producto(s)`;


    if (!filtrados.length) {

        contenedor.innerHTML = `
            <div class="sin-resultados">
                No hay productos que coincidan con la búsqueda.
            </div>
        `;

        return;
    }


    contenedor.innerHTML = filtrados
        .map(productoHTML)
        .join("");
}


// ==========================================
// HTML DE PRODUCTO
// ==========================================

function productoHTML(producto) {

    const activo =
        Boolean(producto.activo);

    return `

        <div
            class="producto"
            data-id="${producto.id}"
        >

            <div class="producto-header">

                <div>

                    <div class="producto-id">
                        PRODUCTO #${producto.id}
                    </div>

                    <h2>
                        ${escapeHTML(
                            producto.nombre || "Sin nombre"
                        )}
                    </h2>

                </div>


                <div class="acciones">

                    <button
                        class="btn-guardar"
                        onclick="guardarProducto(${producto.id})"
                    >
                        💾 Guardar
                    </button>

                    <button
                        class="${
                            activo
                                ? "btn-editar"
                                : "btn-guardar"
                        }"
                        onclick="cambiarActivo(${producto.id})"
                    >
                        ${
                            activo
                                ? "🔴 Desactivar"
                                : "🟢 Activar"
                        }
                    </button>

                    <button
                        class="btn-eliminar"
                        onclick="eliminarProducto(${producto.id})"
                    >
                        🗑️ Eliminar
                    </button>

                </div>

            </div>


            <div class="grid">


                <div class="campo">

                    <label>
                        Nombre del producto
                    </label>

                    <input
                        id="nombre-${producto.id}"
                        value="${escapeAttr(
                            producto.nombre || ""
                        )}"
                    >

                </div>


                <div class="campo">

                    <label>
                        Precio
                    </label>

                    <input
                        id="precio-${producto.id}"
                        type="number"
                        step="0.01"
                        value="${Number(
                            producto.precio || 0
                        )}"
                    >

                </div>


                <div class="campo">

                    <label>
                        Categoría
                    </label>

                    <input
                        id="categoria-${producto.id}"
                        value="${escapeAttr(
                            producto.categoria || ""
                        )}"
                    >

                </div>


                <div class="campo">

                    <label>
                        Estado
                    </label>

                    <div class="activo">

                        <input
                            id="activo-${producto.id}"
                            type="checkbox"
                            ${
                                activo
                                    ? "checked"
                                    : ""
                            }
                        >

                        <span>
                            ${
                                activo
                                    ? "Producto activo"
                                    : "Producto desactivado"
                            }
                        </span>

                    </div>

                </div>


                <div class="campo campo-completo">

                    <label>
                        Imagen del producto
                    </label>

                    <div class="imagen-box">

                        ${
                            producto.imagen
                                ? `
                                    <img
                                        id="preview-${producto.id}"
                                        class="preview"
                                        src="${escapeAttr(
                                            producto.imagen
                                        )}"
                                    >
                                `
                                : `
                                    <div
                                        id="preview-${producto.id}"
                                        class="preview"
                                    ></div>
                                `
                        }


                        <div class="upload-info">

                            <input
                                type="file"
                                id="file-${producto.id}"
                                accept="image/*"
                            >

                            <br><br>

                            <button
                                class="btn-subir"
                                onclick="subirImagen(${producto.id})"
                            >
                                📤 Subir imagen
                            </button>

                            <input
                                type="hidden"
                                id="imagen-${producto.id}"
                                value="${escapeAttr(
                                    producto.imagen || ""
                                )}"
                            >

                        </div>

                    </div>

                </div>


                <div class="campo campo-completo">

                    <label>
                        Descripción
                    </label>

                    <textarea
                        id="descripcion-${producto.id}"
                    >${escapeHTML(
                        producto.descripcion || ""
                    )}</textarea>

                </div>


                <div class="campo campo-completo">

                    <label>
                        Detalles
                    </label>

                    <textarea
                        id="detalles-${producto.id}"
                    >${escapeHTML(
                        producto.detalles || ""
                    )}</textarea>

                </div>


                <div class="campo campo-completo">

                    <label>
                        Solicitud
                    </label>

                    <textarea
                        id="solicitud-${producto.id}"
                    >${escapeHTML(
                        producto.solicitud || ""
                    )}</textarea>

                </div>


            </div>

        </div>

    `;
}


// ==========================================
// SUBIR IMAGEN
// ==========================================

async function subirImagen(id) {

    const input =
        document.getElementById(`file-${id}`);

    const archivo = input.files[0];

    if (!archivo) {

        mensaje(
            "Selecciona primero una imagen.",
            "error"
        );

        return;
    }


    if (!archivo.type.startsWith("image/")) {

        mensaje(
            "El archivo seleccionado no es una imagen.",
            "error"
        );

        return;
    }


    // Evitamos enviar archivos enormes
    if (archivo.size > 4 * 1024 * 1024) {

        mensaje(
            "La imagen debe pesar menos de 4 MB.",
            "error"
        );

        return;
    }


    try {

        mensaje("Subiendo imagen...");


        const base64 = await archivoABase64(archivo);


        const nombre =
            document.getElementById(
                `nombre-${id}`
            ).value;


        const respuesta = await fetch(
            "/api/upload",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    imagen: base64,
                    nombre
                })
            }
        );


        const resultado =
            await respuesta.json();


        if (!respuesta.ok) {

            throw new Error(
                resultado.detalle ||
                resultado.error ||
                "Error al subir imagen"
            );
        }


        document.getElementById(
            `imagen-${id}`
        ).value = resultado.url;


        const preview =
            document.getElementById(
                `preview-${id}`
            );


        if (preview.tagName === "IMG") {

            preview.src = resultado.url;

        } else {

            preview.outerHTML = `
                <img
                    id="preview-${id}"
                    class="preview"
                    src="${escapeAttr(
                        resultado.url
                    )}"
                >
            `;

        }


        mensaje(
            "Imagen subida correctamente."
        );

    } catch (error) {

        console.error(error);

        mensaje(
            "Error al subir: " + error.message,
            "error"
        );
    }
}


// ==========================================
// ARCHIVO A BASE64
// ==========================================

function archivoABase64(archivo) {

    return new Promise((resolve, reject) => {

        const lector =
            new FileReader();

        lector.onload = () =>
            resolve(lector.result);

        lector.onerror = reject;

        lector.readAsDataURL(archivo);

    });
}


// ==========================================
// GUARDAR PRODUCTO
// ==========================================

async function guardarProducto(id) {

    const producto =
        productos.find(
            p => Number(p.id) === Number(id)
        );


    if (!producto) return;


    producto.nombre =
        document.getElementById(
            `nombre-${id}`
        ).value;

    producto.precio =
        Number(
            document.getElementById(
                `precio-${id}`
            ).value
        ) || 0;

    producto.categoria =
        document.getElementById(
            `categoria-${id}`
        ).value;

    producto.imagen =
        document.getElementById(
            `imagen-${id}`
        ).value;

    producto.descripcion =
        document.getElementById(
            `descripcion-${id}`
        ).value;

    producto.detalles =
        document.getElementById(
            `detalles-${id}`
        ).value;

    producto.solicitud =
        document.getElementById(
            `solicitud-${id}`
        ).value;

    producto.activo =
        document.getElementById(
            `activo-${id}`
        ).checked;


    try {

        const respuesta =
            await fetch(
                "/api/productos",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify([
                        producto
                    ])
                }
            );


        const resultado =
            await respuesta.json();


        if (!respuesta.ok) {

            throw new Error(
                resultado.detalle ||
                resultado.error ||
                "Error al guardar"
            );
        }


        mensaje(
            "Producto guardado correctamente."
        );


        renderProductos();

    } catch (error) {

        console.error(error);

        mensaje(
            error.message,
            "error"
        );
    }
}


// ==========================================
// ACTIVAR / DESACTIVAR
// ==========================================

async function cambiarActivo(id) {

    const producto =
        productos.find(
            p => Number(p.id) === Number(id)
        );


    if (!producto) return;


    producto.activo =
        !Boolean(producto.activo);


    await guardarProducto(id);
}


// ==========================================
// ELIMINAR
// ==========================================

async function eliminarProducto(id) {

    const producto =
        productos.find(
            p => Number(p.id) === Number(id)
        );


    if (!producto) return;


    const confirmar =
        confirm(
            `¿Seguro que quieres eliminar "${producto.nombre}"?`
        );


    if (!confirmar) return;


    try {

        const respuesta =
            await fetch(
                "/api/productos",
                {
                    method: "DELETE",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        id
                    })
                }
            );


        const resultado =
            await respuesta.json();


        if (!respuesta.ok) {

            throw new Error(
                resultado.detalle ||
                resultado.error ||
                "No se pudo eliminar"
            );
        }


        productos =
            productos.filter(
                p => Number(p.id) !== Number(id)
            );


        renderProductos();


        mensaje(
            "Producto eliminado correctamente."
        );

    } catch (error) {

        console.error(error);

        mensaje(
            error.message,
            "error"
        );
    }
}


// ==========================================
// NUEVO PRODUCTO
// ==========================================

async function nuevoProducto() {

    const ids =
        productos.map(
            p => Number(p.id) || 0
        );


    const nuevoId =
        ids.length
            ? Math.max(...ids) + 1
            : 1;


    const nuevo = {

        id: nuevoId,

        nombre: "Nuevo producto",

        precio: 0,

        categoria: "",

        imagen: "",

        descripcion: "",

        detalles: "",

        solicitud: "",

        activo: true

    };


    productos.push(nuevo);


    renderProductos();


    setTimeout(() => {

        const elemento =
            document.querySelector(
                `[data-id="${nuevoId}"]`
            );

        if (elemento) {

            elemento.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        }

    }, 100);

}


// ==========================================
// ESCAPAR HTML
// ==========================================

function escapeHTML(valor) {

    return String(valor || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttr(valor) {

    return escapeHTML(valor);
}


// ==========================================
// BUSCADOR
// ==========================================

document
    .getElementById("buscar")
    .addEventListener(
        "input",
        renderProductos
    );


// ==========================================
// INICIAR
// ==========================================

cargarProductos();

</script>

</body>

</html>
